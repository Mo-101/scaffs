version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: scaffs-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_DB: "${POSTGRES_DB:-mostar}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mostar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: scaffs-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: ["api"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: scaffs-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - api
    env_file:
      - .env
    command: ["worker"]

volumes:
  postgres_data:
