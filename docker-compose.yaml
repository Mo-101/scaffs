services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mostar}"
      POSTGRES_DB: "${POSTGRES_DB:-mostar}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host: api/worker reach this over the internal
    # compose network as "postgres:5432" (see docker-entrypoint.sh). A host
    # port here isn't needed, and on a shared VPS it's one less thing to
    # collide with whatever else happens to be listening on the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mostar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    command: ["api"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    depends_on:
      - postgres
      - api
    env_file:
      - ${ENV_FILE:-.env}
    command: ["worker"]

volumes:
  postgres_data:
