name: scaffs

services:
  postgres:
    container_name: scaffs-postgres-1
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mostar}"
      POSTGRES_DB: "${POSTGRES_DB:-mostar}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host: api/worker reach this over the internal
    # compose network as "postgres:5432" (see docker-entrypoint.sh). A host
    # port here isn't needed, and on a shared VPS it's one less thing to
    # collide with whatever else happens to be listening on the host.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mostar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: scaffs-api-1
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      VIBE_TRADING_TRUST_DOCKER_LOOPBACK: "1"
      # Route Idim Ikang API calls to the WSL host instead of the container loopback.
      # The bridge defaults to IDIM_API_URL which points at 127.0.0.1:41050;
      # inside Docker that address is the container itself, not the host.
      # host-gateway resolves to the Docker bridge gateway (i.e. the host).
      IDIM_API_URL: "http://host-gateway:41050"
    extra_hosts:
      - "host-gateway:host-gateway"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    command: ["api"]

  worker:
    container_name: scaffs-worker-1
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    depends_on:
      - postgres
      - api
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      VIBE_TRADING_TRUST_DOCKER_LOOPBACK: "1"
      IDIM_API_URL: "http://host-gateway:41050"
    extra_hosts:
      - "host-gateway:host-gateway"
    command: ["worker"]

volumes:
  postgres_data:

